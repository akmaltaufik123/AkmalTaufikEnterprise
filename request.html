<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://lmvgxcdlnpckmqjjsqwf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Permohonan Baru — Portal Pelanggan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-ring"><div class="loader-spin"></div></div>
      <div class="loader-dot"></div>
      <div class="loader-text">Sila tunggu...</div>
    </div>
  </div>

  <video class="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="assets/rain.mp4" type="video/mp4">
  </video>

  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand"><img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="logo-img"></a>
      <nav class="portal-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="request.html" class="active">Permohonan Baru</a>
        <a href="my-requests.html">Permohonan Saya</a>
        <a href="classes.html">Kelas</a>
        <a href="admin.html" id="admin-link" hidden>Admin</a>
        <button id="signout-btn" class="btn btn-ghost btn-sm">Log Keluar</button>
      </nav>
    </div>
  </header>

  <main class="portal-main">
    <div class="container container-narrow">
      <div class="portal-header">
        <h2>Permohonan Perkhidmatan</h2>
        <p class="muted">Isi borang di bawah untuk memohon perkhidmatan. Kami akan menghubungi anda.</p>
      </div>

      <div class="card">
        <form id="request-form" novalidate>
          <div class="form-group">
            <label for="service">Jenis Perkhidmatan</label>
            <select id="service" required>
              <option value="">-- Pilih perkhidmatan --</option>
              <option>Pemasangan Server, Rack Server, WiFi &amp; CCTV</option>
              <option>Pemasangan Kabel Rangkaian</option>
              <option>Pemasangan Komputer &amp; Laptop</option>
              <option>Kelas Asas Kecerdasan Buatan (AI)</option>
              <option>Kelas Asas Komputer</option>
              <option>Lain-lain</option>
            </select>
          </div>
          <div class="form-group">
            <label for="location">Kawasan / Lokasi</label>
            <input type="text" id="location" placeholder="cth: Bayan Lepas, Pulau Pinang" required>
          </div>
          <div class="form-group">
            <label for="description">Penerangan</label>
            <textarea id="description" rows="4" placeholder="Terangkan keperluan anda"></textarea>
          </div>
          <p id="form-error" class="form-error" hidden></p>
          <button type="submit" class="btn btn-primary">Hantar Permohonan</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/customize.js"></script>
  <script>
    (function () {
      window.portal.requireAuth().then(async function (session) {
        if (!session) return;
        var form = document.getElementById("request-form");
        var errorBox = document.getElementById("form-error");
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          var p = window.portal;
          var service = document.getElementById("service").value;
          var location = p.sanitize(document.getElementById("location").value, 120);
          var description = p.sanitize(document.getElementById("description").value, 1000);
          if (!service || !location) {
            errorBox.textContent = "Sila pilih perkhidmatan dan masukkan lokasi.";
            errorBox.hidden = false;
            return;
          }
          if (!["Pemasangan Server, Rack Server, WiFi & CCTV", "Pemasangan Kabel Rangkaian", "Pemasangan Komputer & Laptop", "Kelas Asas Kecerdasan Buatan (AI)", "Kelas Asas Komputer", "Lain-lain"].includes(service)) {
            errorBox.textContent = "Perkhidmatan tidak sah.";
            errorBox.hidden = false;
            return;
          }
          var { error } = await window.portal.supabase.from("service_requests").insert({
            user_id: session.user.id,
            service: service,
            location: location,
            description: description,
            status: "pending"
          });
          if (error) {
            errorBox.textContent = error.message;
            errorBox.hidden = false;
            return;
          }
          errorBox.className = "alert ok";
          errorBox.textContent = "Permohonan berjaya dihantar!";
          errorBox.hidden = false;
          form.reset();
        });
      });
    })();
  </script>
  <script>
    (function () {
      var L = document.getElementById("loader");
      if (!L) return;
      function done() {
        if (L.dataset.done) return;
        L.dataset.done = "1";
        L.classList.add("loader-hide");
        setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 700);
      }
      window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
</html>
