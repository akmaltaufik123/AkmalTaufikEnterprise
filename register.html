<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://lmvgxcdlnpckmqjjsqwf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">

  <title>Daftar — Portal Pelanggan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="radial-bg">
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-ring"><div class="loader-spin"></div></div>
      <div class="loader-dot"></div>
      <div class="loader-text" data-i18n="loading-text">Sila tunggu...</div>
    </div>
  </div>

  

  <main class="auth-body">
    <div class="lang-switch login-lang">
      <button class="lang-btn" data-lang="my">MY</button>
      <button class="lang-btn" data-lang="en">ENG</button>
    </div>
    <div class="auth-card">
      <a href="index.html" class="brand auth-brand"><img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="logo-img"></a>
      <h1 data-i18n="rg-title">Daftar Akaun</h1>
      <p class="muted" data-i18n="rg-sub">Buka akaun portal pelanggan percuma.</p>

      <form id="register-form" novalidate>
        <div class="hp-field" aria-hidden="true"><input type="text" id="rg-hp" tabindex="-1" autocomplete="off"></div>
        <div class="form-group">
          <label for="name" data-i18n="rg-name">Nama Penuh</label>
          <input type="text" id="name" placeholder="Nama anda" required>
        </div>
        <div class="form-group">
          <label for="email" data-i18n="rg-email">E-mel</label>
          <input type="email" id="email" placeholder="anda@email.com" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="rg-pass">Kata Laluan</label>
          <input type="password" id="password" placeholder="Minimum 6 aksara" minlength="6" required>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="rg-btn">Daftar</button>
      </form>

      <p class="auth-switch" data-i18n="rg-have">Sudah ada akaun? <a href="login.html">Log Masuk</a></p>
      <p class="auth-switch"><a href="index.html" data-i18n="lg-back">&larr; Kembali ke laman utama</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/customize.js"></script>
  <script>
    (function () {
      var dict = {
        my: {
          "rg-title": "Daftar Akaun",
          "rg-sub": "Buka akaun portal pelanggan percuma.",
          "rg-name": "Nama Penuh",
          "rg-email": "E-mel",
          "rg-pass": "Kata Laluan",
          "rg-btn": "Daftar",
          "rg-have": "Sudah ada akaun? <a href=\"login.html\">Log Masuk</a>",
          "lg-back": "&larr; Kembali ke laman utama",
          "loading-text": "Sila tunggu...",
          "err-config": "Pendaftaran belum dikonfigurasi. Hubungi pentadbir.",
          "err-name": "Sila masukkan nama penuh yang sah (huruf sahaja).",
          "err-email": "Format e-mel tidak sah.",
          "err-pass": "Kata laluan minimum 6 aksara.",
          "rg-ok": "Pendaftaran berjaya! Sila sahkan e-mel anda sebelum log masuk."
        },
        en: {
          "rg-title": "Register Account",
          "rg-sub": "Create a free customer portal account.",
          "rg-name": "Full Name",
          "rg-email": "Email",
          "rg-pass": "Password",
          "rg-btn": "Register",
          "rg-have": "Already have an account? <a href=\"login.html\">Login</a>",
          "lg-back": "&larr; Back to homepage",
          "loading-text": "Please wait...",
          "err-config": "Registration is not configured. Contact the administrator.",
          "err-name": "Please enter a valid full name (letters only).",
          "err-email": "Invalid email format.",
          "err-pass": "Password must be at least 6 characters.",
          "rg-ok": "Registration successful! Please verify your email before logging in."
        }
      };
      var lang = localStorage.getItem("site_lang") || "my";
      function apply() {
        var t = dict[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (t[k] != null) el.innerHTML = t[k];
        });
        document.querySelectorAll(".lang-btn").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-lang") === lang);
        });
        document.documentElement.lang = lang === "my" ? "ms" : "en";
        window.__rg = t;
      }
      document.querySelectorAll(".lang-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          lang = b.getAttribute("data-lang");
          localStorage.setItem("site_lang", lang);
          apply();
        });
      });
      apply();
    })();
  </script>
  <script>
    (function () {
      var errorBox = document.getElementById("form-error");
      var form = document.getElementById("register-form");
      var T = function (k) { return (window.__rg && window.__rg[k]) || ""; };
      if (!window.portal.supabase) {
        errorBox.textContent = T("err-config");
        errorBox.hidden = false;
      }
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (document.getElementById("rg-hp").value) return;
        var p = window.portal;
        var name = p.sanitize(document.getElementById("name").value, 60);
        var email = document.getElementById("email").value.trim().toLowerCase();
        var password = document.getElementById("password").value;
        if (name.length < 2 || !/^[A-Za-z\u00C0-\u024F' .-]+$/.test(name)) {
          errorBox.textContent = T("err-name");
          errorBox.hidden = false;
          return;
        }
        if (!p.isValidEmail(email)) {
          errorBox.textContent = T("err-email");
          errorBox.hidden = false;
          return;
        }
        if (password.length < 6 || password.length > 72) {
          errorBox.textContent = T("err-pass");
          errorBox.hidden = false;
          return;
        }
        var res = await window.portal.supabase.auth.signUp({
          email: email,
          password: password,
          options: { data: { full_name: name } }
        });
        if (res.error) {
          errorBox.textContent = res.error.message;
          errorBox.hidden = false;
          return;
        }
        if (res.data.session) {
          window.location.href = "dashboard.html";
        } else {
          errorBox.className = "alert ok";
          errorBox.textContent = T("rg-ok");
          errorBox.hidden = false;
        }
      });
    })();
  </script>
  <script>
    (function () {
      var L = document.getElementById("loader");
      if (!L) return;
      function done() {
        if (L.dataset.done) return;
        L.dataset.done = "1";
        L.classList.add("loader-hide");
        setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 700);
      }
      window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
</html>
