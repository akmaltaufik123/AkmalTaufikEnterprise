<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://lmvgxcdlnpckmqjjsqwf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">

  <title>Kelas — Portal Pelanggan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260814">
</head>
<body class="radial-bg">
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-ring"><div class="loader-spin"></div></div>
      <div class="loader-dot"></div>
      <div class="loader-text">Sila tunggu...</div>
    </div>
  </div>

  

  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand"><img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="logo-img"></a>
      <nav class="portal-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="request.html">Permohonan Baru</a>
        <a href="my-requests.html">Permohonan Saya</a>
        <a href="bookings.html">Tempahan</a>
        <a href="classes.html" class="active">Kelas</a>
        <a href="admin.html" id="admin-link" hidden>Admin</a>
        <button id="signout-btn" class="btn btn-ghost btn-sm">Log Keluar</button>
      </nav>
    </div>
  </header>

  <main class="portal-main">
    <div class="container">
      <div class="portal-header">
        <h2>Pendaftaran Kelas</h2>
        <p class="muted">Pilih kursus dan daftar untuk kelas online atau bersemuka.</p>
      </div>

      <div id="courses-grid" class="grid grid-3">
        <p class="muted">Memuatkan kursus...</p>
      </div>

      <h2 class="sub-title">Kelas Saya</h2>
      <div class="card">
        <div id="enrolled-list"><p class="muted">Memuatkan...</p></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=20260814"></script>
  <script src="js/portal.js?v=20260814"></script>
  <script src="js/customize.js?v=20260814"></script>
  <script>
    (function () {
      window.portal.requireAuth().then(async function (session) {
        if (!session) return;
        var sb = window.portal.supabase;
        var listBox = document.getElementById("enrolled-list");
        var gridBox = document.getElementById("courses-grid");

        var FONT_OPTIONS = ["Orbitron", "Chakra Petch", "Arial", "Verdana", "Georgia", "Courier New", "Impact"];
        var FONT_SIZES = { "kecil": "0.9rem", "sederhana": "1.15rem", "besar": "1.45rem" };

        function fontPreview(f) {
          var map = { "Orbitron": "'Orbitron', sans-serif", "Chakra Petch": "'Chakra Petch', sans-serif" };
          return map[f] || f;
        }

        function fmt12(t) {
          if (!t) return "";
          var h = parseInt(t.slice(0, 2), 10);
          var mi = t.slice(3, 5);
          var ap = h >= 12 ? "PM" : "AM";
          var hh = h % 12 || 12;
          return hh + ":" + mi + " " + ap;
        }

        async function loadCourses() {
          var { data, error } = await sb.from("courses").select("*").eq("active", true).order("position").order("created_at");
          var esc = window.portal.esc;
          if (error) {
            gridBox.innerHTML = '<p class="muted">Ralat: ' + esc(error.message) + '</p>';
            return;
          }
          if (!data || data.length === 0) {
            gridBox.innerHTML = '<p class="muted">Tiada kursus buat masa ini.</p>';
            return;
          }
          gridBox.innerHTML = data.map(function (c, i) {
            var cardStyle = 'style="background:' + esc(c.bg_color || "#16161c") + ';color:' + esc(c.color || "#f4f4f5") + ';font-family:' + fontPreview(c.font_family) + '"';
            var titleStyle = 'style="font-size:' + (FONT_SIZES[c.font_size] || "1.15rem") + '"';
            var img = c.image_url
              ? '<div class="course-img-wrap"><img class="course-img" src="' + esc(c.image_url) + '" alt=""></div>'
              : "";
            var vid = c.video_url
              ? '<video class="course-video" src="' + esc(c.video_url) + '" controls preload="metadata"></video>'
              : "";
            var price = c.price != null && c.price !== ""
              ? '<p class="class-price">RM ' + esc(Number(c.price).toFixed(2)) + '</p>'
              : "";
            var badges = "";
            if (c.class_time) badges += '<span class="badge in_progress">' + esc(fmt12(c.class_time)) + '</span>';
            badges += '<span class="badge done">' + esc(c.mode) + '</span>';
            if (c.instructor_name) {
              badges += '<span class="badge confirmed">' + esc(c.instructor_name) + '</span>';
              if (c.instructor_type) badges += '<span class="badge pending">' + esc(c.instructor_type) + '</span>';
            }
            var dets = [];
            if (c.region) dets.push('<div class="det"><span class="det-label">Wilayah</span><span>' + esc(c.region) + '</span></div>');
            if (c.nation) dets.push('<div class="det"><span class="det-label">Negara</span><span>' + esc(c.nation) + '</span></div>');
            if (c.ssm) dets.push('<div class="det"><span class="det-label">No. SSM</span><span>' + esc(c.ssm) + '</span></div>');
            var detHtml = dets.length
              ? '<div class="class-dets" id="dets-' + i + '" hidden>' + dets.join("") + '</div>'
              : "";
            return '<div class="card class-card" data-course="' + esc(c.id) + '" ' + cardStyle + '>' +
              img +
              vid +
              '<h3 ' + titleStyle + '>' + esc(c.name) + '</h3>' +
              price +
              '<p>' + esc(c.description || "") + '</p>' +
              '<div class="class-badges">' + badges + '</div>' +
              detHtml +
              '<div class="form-group"><label>Mod Kelas</label><select id="mode-' + i + '">' +
              (esc(c.mode).indexOf("Bersemuka") > -1 ? '<option>Bersemuka</option>' : "") +
              (esc(c.mode).indexOf("Online") > -1 ? '<option>Online</option>' : "") +
              (esc(c.mode).indexOf("Online") === -1 && esc(c.mode).indexOf("Bersemuka") === -1 ? '<option>Online</option>' : "") +
              "</select></div>" +
              '<div class="class-cta">' +
              '<button class="btn btn-ghost btn-sm" data-toggledets="' + i + '"' + (dets.length ? "" : " hidden") + '>Butiran</button> ' +
              '<button class="btn btn-primary" data-enroll="' + i + '" data-name="' + esc(c.name) + '">Daftar Kelas</button></div></div>';
          }).join("");

          gridBox.querySelectorAll("[data-toggledets]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var box = document.getElementById("dets-" + btn.getAttribute("data-toggledets"));
              if (!box) return;
              box.hidden = !box.hidden;
              btn.textContent = box.hidden ? "Butiran" : "Tutup";
            });
          });
          gridBox.querySelectorAll("[data-enroll]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
              var idx = btn.getAttribute("data-enroll");
              var name = btn.getAttribute("data-name");
              var mode = document.getElementById("mode-" + idx).value;
              var existing = await sb.from("class_enrollments")
                .select("id")
                .eq("user_id", session.user.id)
                .eq("class_name", name)
                .eq("mode", mode);
              if (existing.data && existing.data.length > 0) {
                alert("Anda sudah mendaftar untuk kelas ini (" + mode + ").");
                return;
              }
              var { error } = await sb.from("class_enrollments").insert({
                user_id: session.user.id,
                class_name: name,
                mode: mode
              });
              if (error) {
                alert("Ralat: " + error.message);
                return;
              }
              alert("Pendaftaran berjaya: " + name + " (" + mode + ")");
              loadEnrolled();
            });
          });
        }

        async function loadEnrolled() {
          var { data, error } = await sb.from("class_enrollments")
            .select("class_name, mode, created_at")
            .order("created_at", { ascending: false });
          var esc = window.portal.esc;
          if (error) {
            listBox.innerHTML = '<p class="muted">Ralat: ' + esc(error.message) + '</p>';
            return;
          }
          if (!data || data.length === 0) {
            listBox.innerHTML = '<p class="muted">Belum mendaftar sebarang kelas.</p>';
            return;
          }
          listBox.innerHTML = '<table class="table"><thead><tr><th>Kelas</th><th>Mod</th><th>Tarikh Daftar</th></tr></thead><tbody>' +
            data.map(function (e) {
              return '<tr><td>' + esc(e.class_name) + '</td><td>' + esc(e.mode) + '</td><td>' +
                new Date(e.created_at).toLocaleDateString("ms-MY") + '</td></tr>';
            }).join("") + '</tbody></table>';
        }

        loadCourses();
        loadEnrolled();
      });
    })();
  </script>
  <script>
    (function () {
      var L = document.getElementById("loader");
      if (!L) return;
      function done() {
        if (L.dataset.done) return;
        L.dataset.done = "1";
        L.classList.add("loader-hide");
        setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 700);
      }
      window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
</html>
