<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://lmvgxcdlnpckmqjjsqwf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">

  <title>Log Masuk — Portal Pelanggan</title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="radial-bg">
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-ring"><div class="loader-spin"></div></div>
      <div class="loader-dot"></div>
      <div class="loader-text" data-i18n="loading-text">Sila tunggu...</div>
    </div>
  </div>

  

  <main class="auth-body">
    <div class="lang-switch login-lang">
      <button class="lang-btn" data-lang="my">MY</button>
      <button class="lang-btn" data-lang="en">ENG</button>
    </div>
    <div class="auth-card auth-card-split">
      <div class="auth-left">
        <h1 data-i18n="lg-title">Log Masuk</h1>
        <p class="muted" data-i18n="lg-sub">Masuk ke portal pelanggan anda.</p>

        <form id="login-form" novalidate>
          <div class="hp-field" aria-hidden="true"><input type="text" id="lg-hp" tabindex="-1" autocomplete="off"></div>
          <div class="form-group">
            <label for="email" data-i18n="lg-email">E-mel</label>
            <input type="email" id="email" placeholder="anda@email.com" required>
          </div>
          <div class="form-group">
            <label for="password" data-i18n="lg-pass">Kata Laluan</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <p id="form-error" class="form-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="lg-btn">Log Masuk</button>
        </form>

        <p class="auth-switch" data-i18n="lg-register">Tiada akaun? <a href="register.html">Daftar Sekarang</a></p>
        <p class="auth-switch"><a href="index.html" data-i18n="lg-back">&larr; Kembali ke laman utama</a></p>
      </div>

      <div class="auth-right">
        <div class="auth-right-inner">
          <img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="auth-logo">
          <h2>Akmal Taufik Enterprise</h2>
          <p class="muted" data-i18n="lg-services">Server &middot; Rack Server &middot; WiFi &middot; CCTV &middot; Komputer</p>
          <p class="auth-right-sub" data-i18n="lg-portal">Portal Pelanggan — Tempah, mohon perkhidmatan dan daftar kelas dalam satu tempat.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/customize.js"></script>
  <script>
    (function () {
      var dict = {
        my: {
          "lg-title": "Log Masuk",
          "lg-sub": "Masuk ke portal pelanggan anda.",
          "lg-email": "E-mel",
          "lg-pass": "Kata Laluan",
          "lg-btn": "Log Masuk",
          "lg-register": "Tiada akaun? <a href=\"register.html\">Daftar Sekarang</a>",
          "lg-back": "&larr; Kembali ke laman utama",
          "lg-services": "Server &middot; Rack Server &middot; WiFi &middot; CCTV &middot; Komputer",
          "lg-portal": "Portal Pelanggan — Tempah, mohon perkhidmatan dan daftar kelas dalam satu tempat.",
          "loading-text": "Sila tunggu...",
          "err-config": "Log masuk belum dikonfigurasi. Hubungi pentadbir.",
          "err-valid": "Sila masukkan e-mel dan kata laluan yang sah.",
          "err-wait": "Terlalu banyak percubaan. Sila tunggu ",
          "err-wait-sec": " saat.",
          "sending": "Menghantar..."
        },
        en: {
          "lg-title": "Login",
          "lg-sub": "Sign in to your customer portal.",
          "lg-email": "Email",
          "lg-pass": "Password",
          "lg-btn": "Login",
          "lg-register": "No account? <a href=\"register.html\">Register now</a>",
          "lg-back": "&larr; Back to homepage",
          "lg-services": "Server &middot; Rack Server &middot; WiFi &middot; CCTV &middot; Computers",
          "lg-portal": "Customer Portal — Book, request services, and register for classes in one place.",
          "loading-text": "Please wait...",
          "err-config": "Login is not configured. Contact the administrator.",
          "err-valid": "Please enter a valid email and password.",
          "err-wait": "Too many attempts. Please wait ",
          "err-wait-sec": " seconds.",
          "sending": "Sending..."
        }
      };
      var lang = localStorage.getItem("site_lang") || "my";
      function apply() {
        var t = dict[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (t[k] != null) el.innerHTML = t[k];
        });
        document.querySelectorAll(".lang-btn").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-lang") === lang);
        });
        document.documentElement.lang = lang === "my" ? "ms" : "en";
        window.__lg = t;
      }
      document.querySelectorAll(".lang-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          lang = b.getAttribute("data-lang");
          localStorage.setItem("site_lang", lang);
          apply();
        });
      });
      apply();
    })();
  </script>
  <script>
    (function () {
      var errorBox = document.getElementById("form-error");
      var form = document.getElementById("login-form");
      var T = function (k) { return (window.__lg && window.__lg[k]) || ""; };
      if (!window.portal.supabase) {
        errorBox.textContent = T("err-config");
        errorBox.hidden = false;
      }
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (document.getElementById("lg-hp").value) return;
        var email = document.getElementById("email").value.trim().toLowerCase();
        var password = document.getElementById("password").value;
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !password) {
          errorBox.textContent = T("err-valid");
          errorBox.hidden = false;
          return;
        }
        var now = Date.now();
        var win = form._win || { count: 0, ts: 0 };
        if (win.count >= 5 && now - win.ts < 60000) {
          var wait = Math.ceil((60000 - (now - win.ts)) / 1000);
          errorBox.textContent = T("err-wait") + wait + T("err-wait-sec");
          errorBox.hidden = false;
          return;
        }
        var btn = form.querySelector("button[type=submit]");
        btn.disabled = true;
        btn.textContent = T("sending");
        var res = await window.portal.supabase.auth.signInWithPassword({ email: email, password: password });
        btn.disabled = false;
        btn.textContent = T("lg-btn");
        if (res.error) {
          if (now - win.ts > 60000) { win.count = 0; win.ts = now; }
          win.count++;
          win.ts = now;
          form._win = win;
          errorBox.textContent = res.error.message;
          errorBox.hidden = false;
          return;
        }
        window.location.href = "dashboard.html";
      });
    })();
  </script>
  <script>
    (function () {
      var L = document.getElementById("loader");
      if (!L) return;
      function done() {
        if (L.dataset.done) return;
        L.dataset.done = "1";
        L.classList.add("loader-hide");
        setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 700);
      }
      window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
</html>
