<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AutomateMY</title>
  <link rel="icon" type="image/png" href="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <a href="index.html" class="brand auth-brand"><img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="logo-img"></a>
    <h1>Welcome back</h1>
    <p class="muted">Login to manage your automations.</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@company.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <p id="form-error" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
    <p class="auth-switch"><a href="index.html">&larr; Back to home</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
