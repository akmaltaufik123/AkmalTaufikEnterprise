<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://lmvgxcdlnpckmqjjsqwf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Log Masuk — Portal Pelanggan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-ring"><div class="loader-spin"></div></div>
      <div class="loader-dot"></div>
      <div class="loader-text">Sila tunggu...</div>
    </div>
  </div>

  <video class="bg-video auth-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="assets/rain.mp4" type="video/mp4">
  </video>

  <main class="auth-body">
    <div class="auth-card">
      <a href="index.html" class="brand auth-brand"><img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="logo-img"></a>
      <h1>Log Masuk</h1>
      <p class="muted">Masuk ke portal pelanggan anda.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">E-mel</label>
          <input type="email" id="email" placeholder="anda@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Kata Laluan</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block">Log Masuk</button>
      </form>

      <p class="auth-switch">Tiada akaun? <a href="register.html">Daftar Sekarang</a></p>
      <p class="auth-switch"><a href="index.html">&larr; Kembali ke laman utama</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/customize.js"></script>
  <script>
    (function () {
      var errorBox = document.getElementById("form-error");
      var form = document.getElementById("login-form");
      if (!window.portal.supabase) {
        errorBox.textContent = "Portal belum dikonfigurasi. Hubungi pentadbir.";
        errorBox.hidden = false;
      }
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim().toLowerCase();
        var password = document.getElementById("password").value;
        var res = await window.portal.supabase.auth.signInWithPassword({ email: email, password: password });
        if (res.error) {
          errorBox.textContent = res.error.message;
          errorBox.hidden = false;
          return;
        }
        window.location.href = "dashboard.html";
      });
    })();
  </script>
  <script>
    (function () {
      var L = document.getElementById("loader");
      if (!L) return;
      function done() {
        if (L.dataset.done) return;
        L.dataset.done = "1";
        L.classList.add("loader-hide");
        setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 700);
      }
      window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
</html>
