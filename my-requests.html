<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://lmvgxcdlnpckmqjjsqwf.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">

  <title>Permohonan Saya — Portal Pelanggan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="radial-bg">
  <div id="loader" class="loader-overlay">
    <div class="loader-inner">
      <div class="loader-ring"><div class="loader-spin"></div></div>
      <div class="loader-dot"></div>
      <div class="loader-text">Sila tunggu...</div>
    </div>
  </div>

  

  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand"><img src="https://plain-apac-prod-public.komododecks.com/202608/12/3HS3RGiBnGa12S29398i/image.png" alt="Logo" class="logo-img"></a>
      <nav class="portal-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="request.html">Permohonan Baru</a>
        <a href="my-requests.html" class="active">Permohonan Saya</a>
        <a href="bookings.html">Tempahan</a>
        <a href="classes.html">Kelas</a>
        <a href="admin.html" id="admin-link" hidden>Admin</a>
        <button id="signout-btn" class="btn btn-ghost btn-sm">Log Keluar</button>
      </nav>
    </div>
  </header>

  <main class="portal-main">
    <div class="container">
      <div class="portal-header">
        <h2>Permohonan Saya</h2>
        <p class="muted">Semak status setiap permohonan anda.</p>
      </div>

      <div class="card">
        <div id="requests-list"><p class="muted">Memuatkan...</p></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/customize.js"></script>
  <script>
    (function () {
      window.portal.requireAuth().then(async function (session) {
        if (!session) return;
        var { data, error } = await window.portal.supabase
          .from("service_requests")
          .select("id, service, location, description, status, created_at")
          .order("created_at", { ascending: false });
        var box = document.getElementById("requests-list");
        var esc = window.portal.esc;
        if (error) {
          box.innerHTML = '<p class="muted">Ralat memuatkan permohonan: ' + esc(error.message) + '</p>';
          return;
        }
        if (!data || data.length === 0) {
          box.innerHTML = '<p class="muted">Belum ada permohonan. <a href="request.html" class="red-link">Buat permohonan pertama anda</a>.</p>';
          return;
        }
        box.innerHTML = '<table class="table"><thead><tr><th>Perkhidmatan</th><th>Lokasi</th><th>Tarikh</th><th>Status</th></tr></thead><tbody>' +
          data.map(function (r) {
            var desc = r.description ? '<div class="table-desc">' + esc(r.description) + '</div>' : '';
            return '<tr><td>' + esc(r.service) + desc + '</td><td>' + esc(r.location) + '</td><td>' +
              new Date(r.created_at).toLocaleDateString("ms-MY") + '</td><td><span class="badge ' + esc(r.status) + '">' +
              window.portal.badge(r.status) + '</span></td></tr>';
          }).join("") + '</tbody></table>';
      });
    })();
  </script>
  <script>
    (function () {
      var L = document.getElementById("loader");
      if (!L) return;
      function done() {
        if (L.dataset.done) return;
        L.dataset.done = "1";
        L.classList.add("loader-hide");
        setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 700);
      }
      window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
</html>
